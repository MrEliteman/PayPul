name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.wheremymoney --project-name where_is_my_money .
      - name: Set app label
        run: sed -i 's/android:label="[^"]*"/android:label="Where Is My Money"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/money_test.dart test/store_test.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: where-is-my-money-apk
          path: build/app/outputs/flutter-apk/app-release.apk
